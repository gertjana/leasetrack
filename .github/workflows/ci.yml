name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]

jobs:
  # ─── Docker ─────────────────────────────────────────────────────────────────
  # Builds the `leasetrack-api` image and pushes it to the GitHub Container
  # Registry (ghcr.io) on every push to main and on version tags.
  # Pull-request builds are built but NOT pushed.
  docker:
    name: Docker (ghcr.io)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # required to push to ghcr.io

    steps:
      - uses: actions/checkout@v4

      # BuildKit with multi-platform support and layer caching.
      - uses: docker/setup-buildx-action@v3

      # Only log in when we are actually going to push (not on PRs).
      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Derive image tags automatically:
      #   push to main  → ghcr.io/<owner>/leasetrack:main  +  :sha-<short>
      #   tag v1.2.3    → ghcr.io/<owner>/leasetrack:1.2.3 +  :1.2  +  :latest
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=leasetrack-api
            org.opencontainers.image.description=Lease car km tracker — REST API

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          no-cache: true
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
