name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]

jobs:
  # ─── CLI ────────────────────────────────────────────────────────────────────
  # Builds the `leasetrack` binary for four targets and uploads each as an
  # artifact. Artifacts are retained for 30 days on every push and forever
  # when triggered by a version tag.
  cli:
    name: CLI (${{ matrix.artifact_name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            binary: leasetrack
            artifact_name: leasetrack-linux-x86_64

          # macos-13 is the last Intel runner; native x86_64 build.
          - os: macos-13
            target: x86_64-apple-darwin
            binary: leasetrack
            artifact_name: leasetrack-macos-x86_64

          # macos-latest is Apple Silicon; native arm64 build.
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: leasetrack
            artifact_name: leasetrack-macos-aarch64

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: leasetrack.exe
            artifact_name: leasetrack-windows-x86_64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # musl-tools provides the musl-gcc wrapper required by the musl target.
      - name: Install musl-tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get install -y musl-tools

      # Cache ~/.cargo/registry and target/ keyed on Cargo.lock + target triple.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build CLI
        run: cargo build --release --package leasetrack-cli --target ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: target/${{ matrix.target }}/release/${{ matrix.binary }}
          # Keep 90 days for tagged releases, 30 days for regular pushes.
          retention-days: ${{ startsWith(github.ref, 'refs/tags/') && 90 || 30 }}

  # ─── Docker ─────────────────────────────────────────────────────────────────
  # Builds the `leasetrack-api` image and pushes it to the GitHub Container
  # Registry (ghcr.io) on every push to main and on version tags.
  # Pull-request builds are built but NOT pushed.
  docker:
    name: Docker (ghcr.io)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # required to push to ghcr.io

    steps:
      - uses: actions/checkout@v4

      # BuildKit with multi-platform support and layer caching.
      - uses: docker/setup-buildx-action@v3

      # Only log in when we are actually going to push (not on PRs).
      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Derive image tags automatically:
      #   push to main  → ghcr.io/<owner>/leasetrack:main  +  :sha-<short>
      #   tag v1.2.3    → ghcr.io/<owner>/leasetrack:1.2.3 +  :1.2  +  :latest
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=leasetrack-api
            org.opencontainers.image.description=Lease car km tracker — REST API

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Reuse GitHub Actions cache between builds to speed up Rust compilation.
          cache-from: type=gha
          cache-to: type=gha,mode=max
